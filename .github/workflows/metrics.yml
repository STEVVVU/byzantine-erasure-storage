name: BFR reproducible metrics
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  benchmark:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      PYTHONPATH: src
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.11'
      - run: python -m pip install --require-hashes -r requirements.lock
      - run: python -m unittest discover -s coursework/bfr_tests -v
      - run: python scripts/benchmark.py --run-id metrics-${{ github.run_id }}-${{ github.run_attempt }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: bfr-metrics-${{ github.run_id }}-${{ github.run_attempt }}
          include-hidden-files: true
          path: .agents/runs/metrics-${{ github.run_id }}-${{ github.run_attempt }}/evidence/
